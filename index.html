<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cleva Natural Intelligence</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="cleva-container">
    <div class="cleva-header">
      <div class="logo-section">
        <div class="cleva-logo">🕯️</div>
        <div>
          <div class="title">CLEVA NI <span style="font-size: 0.6em;">by Anacletus</span></div>
          <div class="subtitle">Natural Intelligence Inspired by God</div>
        </div>
      </div>
      <div class="status-badge">
        <div class="status-light"></div>
        <span>Active | Cleva NI </span>
      </div>
    </div>
    
    <div class="chat-area">
      <div class="messages-container" id="messages-container">
        <div class="welcome-message">
          <div>🧠❤️‍🔥<strong>Cleva NI Online</strong></div>
          <div style="margin-top: 10px;">Ask me anything - I'm here to help!</div>
          <div style="margin-top: 20px; font-size: 0.9em;">💫⚡ Powered by Cleva NI </div>
        </div>
      </div>
      
      <div class="typing-indicator" id="typing-indicator">
        <span>⚡ Cleva NI is processing ⚙️📡</span><span>...</span>
      </div>
      
      <div class="input-area">
        <textarea id="user-input" placeholder="Type your message here... Press Enter to send" rows="2"></textarea>
        <button class="send-btn" id="send-btn">Send ➤</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>

</html>
